[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "ai-course-engine"
version = "0.1.0"
description = "AI-powered educational content ingestion and curriculum planning backend"
requires-python = ">=3.12"
readme = "README.md"


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]


[tool.ruff]
line-length = 88
target-version = "py312"

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "migrations/versions",
    "alembic/versions",
    "backend/alembic/versions",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "ASYNC",
    "N",
]
ignore = [
    "B008",
    # StrEnum over Enum is an intentional design choice.
    "UP042",
    # Existing exception classes intentionally keep their AppError suffix.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy relationships use string forward references which ruff
# cannot resolve to an imported name.
"backend/app/models/*.py" = ["F821"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
exclude = "migrations/"

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
]
ignore_missing_imports = true