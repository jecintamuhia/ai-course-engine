# Railway config-as-code for the API service with Root Directory = backend.
# See https://docs.railway.com/config-as-code (legacy after 2026).

[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  startCommand = "sh /app/scripts/start_api.sh"
  preDeployCommand = ["alembic upgrade head"]
  healthcheckPath = "/health/ready"
  healthcheckTimeout = 120
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10
