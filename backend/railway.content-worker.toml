# Railway config-as-code for the separate content-generation worker.
# Point the service's Config-as-Code Path at this file, or set the same
# start command in the Railway dashboard. This worker does not need the
# upload volume: it reads curriculum data and source chunks from Postgres.
#
# See https://docs.railway.com/config-as-code (legacy after 2026).

[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  startCommand = "sh -c 'exec python -m app.workers.content_worker'"
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10
