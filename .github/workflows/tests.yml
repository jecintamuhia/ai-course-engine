name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest, ruff, alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-key-not-used-in-production
      TRUST_PROXY_HEADERS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies
        run: pip install -r requirements/test.txt
      - name: Ruff
        run: python -m ruff check app tests scripts
      - name: Byte-compile
        run: python -m compileall -q app
      - name: Single Alembic head
        run: |
          heads="$(python -m alembic heads)"
          echo "$heads"
          if [ "$(echo "$heads" | grep -c '(head)')" -ne 1 ]; then
            echo "Expected exactly one Alembic head" >&2
            exit 1
          fi
      - name: Pytest
        run: python -m pytest -q

  frontend:
    name: frontend (vitest, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
